name: global_sos
description: "An offline-first Flutter utility for travelers to instantly access and dial local emergency numbers."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.2
  hooks_riverpod: ^3.3.1
  intl: ^0.20.2
  riverpod_annotation: ^4.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.14.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/logo/
    - assets/icon/